/* ============================================================
   DETECCIÓN AUTOMÁTICA DE NIVEL
   ============================================================ */
function detectarEtapa() {
  const seleccionada = localStorage.getItem('emba_etapa_seleccionada');
  if (seleccionada !== null) {
    const n = parseInt(seleccionada, 10);
    if (n >= 1 && n <= 100) return n;
  }
  try {
    const progreso = JSON.parse(localStorage.getItem('emba_progreso'));
    if (progreso && Array.isArray(progreso.etapas_completadas) && progreso.etapas_completadas.length) {
      const maxima = Math.max.apply(null, progreso.etapas_completadas.filter(n => n >= 1 && n <= 100));
      if (maxima < 100) return maxima + 1;
    }
  } catch (e) { /* progreso corrupto o inexistente */ }
  return 1;
}

/* ============================================================
   GENERADOR DINÁMICO DE DILEMAS
   ============================================================ */
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function signo(n) { return n >= 0 ? '+' + n : String(n); }

function generarEscenario(etapa) {
  const tema = TEMAS_EMBA[etapa];
  const sector = rnd(SECTORES);
  const contexto = rnd(CONTEXTOS);
  const evento = rnd(EVENTOS);
  return {
    etapa: etapa,
    modulo: tema.modulo,
    tema: tema.tema,
    sector: sector.nombre,
    empresa: sector.empresa,
    contexto: contexto,
    evento: evento,
    dilemas: construirDilemas(tema, sector, contexto, evento)
  };
}

/* ============================================================
   RENDER
   ============================================================ */
function renderKPIs() {
  KPI_KEYS.forEach(k => {
    const v = Math.round(kpis[k]);
    document.getElementById('val-' + k).textContent = v + '%';
    document.getElementById('kpi-' + k).classList.toggle('low', v <= 20);
  });
}

function renderCabecera() {
  document.getElementById('stage-title').textContent = 'Etapa ' + escenario.etapa + ' de 100 — ' + escenario.tema;
  document.getElementById('stage-modulo').textContent = 'Módulo: ' + escenario.modulo;
  document.getElementById('stage-meta').innerHTML =
    'Sector: ' + escenario.sector + ' (' + escenario.empresa + ') · Contexto: ' + escenario.contexto;
}

function renderDilemma() {
  const d = escenario.dilemas[dilemmaIndex];
  document.getElementById('dilemma-tag').textContent =
    'Dilema ' + (dilemmaIndex + 1) + ' de ' + escenario.dilemas.length;
  document.getElementById('dilemma-narrative').textContent = d.narrativa;
  const cont = document.getElementById('options-container');
  cont.innerHTML = '';
  d.opciones.forEach((op, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = op.texto;
    btn.addEventListener('click', () => elegirOpcion(i));
    cont.appendChild(btn);
  });
}

function elegirOpcion(i) {
  if (gameOver) return;
  const op = escenario.dilemas[dilemmaIndex].opciones[i];
  KPI_KEYS.forEach(k => { kpis[k] = Math.min(100, Math.max(0, kpis[k] + op.impactos[k])); });
  renderKPIs();
  const impactsDiv = document.getElementById('modal-impacts');
  impactsDiv.innerHTML = '';
  KPI_KEYS.forEach(k => {
    const delta = op.impactos[k];
    const chip = document.createElement('span');
    chip.className = 'impact ' + (delta >= 0 ? 'up' : 'down');
    chip.textContent = KPI_LABELS[k] + ': ' + signo(delta);
    impactsDiv.appendChild(chip);
  });
  document.getElementById('modal-feedback').textContent = op.feedback;
  document.getElementById('modal-backdrop').style.display = 'flex';
}

document.getElementById('modal-btn').addEventListener('click', () => {
  document.getElementById('modal-backdrop').style.display = 'none';
  if (KPI_KEYS.some(k => kpis[k] <= 0)) {
    terminarJuego(false);
    return;
  }
  dilemmaIndex++;
  if (dilemmaIndex >= escenario.dilemas.length) {
    terminarJuego(true);
  } else {
    renderDilemma();
  }
});

function terminarJuego(gano) {
  gameOver = true;
  victoria = gano;
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';
  const title = document.getElementById('result-title');
  const msg = document.getElementById('result-message');
  const lessons = document.getElementById('result-lessons');
  const fk = document.getElementById('final-kpis');
  fk.innerHTML = '';
  KPI_KEYS.forEach(k => {
    const box = document.createElement('div');
    box.className = 'kpi';
    box.innerHTML = '<div class="label">' + KPI_LABELS[k] + '</div><div class="value">' +
      Math.round(Math.max(0, kpis[k])) + '%</div>';
    fk.appendChild(box);
  });
  lessons.innerHTML = '';
  document.getElementById('btn-retry').style.display = gano ? 'none' : 'block';
  document.getElementById('btn-return').textContent = gano ? 'Regresar al Mapa de Ruta' : 'Abandonar y volver al Mapa';
  if (gano) {
    title.textContent = '✅ Etapa ' + escenario.etapa + ' Superada';
    title.className = 'result-title win';
    msg.textContent = 'Has liderado ' + escenario.empresa + ' superando los 3 dilemas de ' + escenario.sector +
      ' en un contexto de ' + escenario.contexto.toLowerCase() + ', manteniendo todos tus KPIs por encima del 0%. Dominio demostrado del tema: ' + escenario.tema + '.';
    [
      'Toda decisión ejecutiva es una decisión de trade-offs: no existe la opción que optimice los cuatro KPIs a la vez.',
      'La velocidad de respuesta importa, pero sin diagnóstico previo es reactividad, no estrategia.',
      'En contextos de ' + escenario.contexto.toLowerCase() + ', proteger la caja y al talento clave es la condición para poder atacar después.',
      'La crisis reordena la industria de ' + escenario.sector + ': quien consolida aprendizaje estructural captura la posición del que desaparece.',
      '"' + escenario.tema + '" deja de ser teoría cuando se convierte en el criterio explícito para elegir dónde competir y dónde no.'
    ].forEach(l => {
      const li = document.createElement('li');
      li.textContent = l;
      lessons.appendChild(li);
    });
  } else {
    const muerto = KPI_KEYS.find(k => kpis[k] <= 0);
    title.textContent = '❌ Destituido';
    title.className = 'result-title lose';
    msg.textContent = 'El consejo de administración de ' + escenario.empresa + ' ha decidido relevarte del cargo. Tu indicador de ' +
      KPI_LABELS_CORTOS[muerto] + ' colapsó al 0% (o menos). En un entorno de ' + escenario.contexto.toLowerCase() +
      ', las decisiones que sacrifican un indicador crítico sin tesis de recuperación acaban en quiebra: sin margen, sin capacidad operativa, sin equipo o sin reputación, el modelo de ' +
      escenario.sector + ' deja de ser viable. Puedes reintentar el mismo desafío académico (' + escenario.tema + ') en un escenario completamente distinto.';
  }
}

/* ============================================================
   REINTENTO: MISMO TEMA, NUEVO ESCENARIO ALEATORIO
   ============================================================ */
function iniciarNivel(etapa) {
  escenario = generarEscenario(etapa);
  kpis = { finanzas: 50, operaciones: 50, talento: 50, mercado: 50 };
  dilemmaIndex = 0;
  gameOver = false;
  victoria = false;
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-game').style.display = 'block';
  document.getElementById('sync-status').textContent = '';
  renderCabecera();
  renderKPIs();
  renderDilemma();
}

document.getElementById('btn-retry').addEventListener('click', () => {
  iniciarNivel(escenario.etapa);
});

/* ============================================================
   PERSISTENCIA LOCAL Y SINCRONIZACIÓN CLOUD (GitHub)
   ============================================================ */
async function sincronizarProgreso() {
  const status = document.getElementById('sync-status');
  const progreso = JSON.parse(localStorage.getItem('emba_progreso'));
  if (progreso) {
    const etapa = escenario.etapa;
    if (!progreso.etapas_completadas || !progreso.etapas_completadas.includes(etapa)) {
      progreso.etapas_completadas = progreso.etapas_completadas || [];
      progreso.etapas_completadas.push(etapa);
      progreso.puntuacion_global = (progreso.puntuacion_global || 0) + 100;
      localStorage.setItem('emba_progreso', JSON.stringify(progreso));
    }
  }

  const token = localStorage.getItem('emba_github_token');
  const sha = localStorage.getItem('emba_github_sha');
  if (token && progreso && progreso.jugador_clave) {
    try {
      status.textContent = 'Sincronizando progreso con la nube…';
      const body = {
        message: 'Etapa ' + escenario.etapa + ' completada — EMBA Game',
        content: btoa(unescape(encodeURIComponent(JSON.stringify(progreso))))
      };
      if (sha) body.sha = sha;
      const resp = await fetch(
        'github.com_' + progreso.jugador_clave + '.json',
        {
          method: 'PUT',
          headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }
      );
      const resultado = await resp.json();
      if (resp.ok && resultado.content && resultado.content.sha) {
        localStorage.setItem('emba_github_sha', resultado.content.sha);
        status.textContent = 'Progreso sincronizado correctamente.';
      } else {
        status.textContent = 'No se pudo sincronizar con la nube (se conserva el progreso local).';
      }
    } catch (e) {
      status.textContent = 'No se pudo sincronizar con la nube (se conserva el progreso local).';
    }
  }
  localStorage.removeItem('emba_etapa_seleccionada');
  setTimeout(() => { window.location.href = 'index.html'; }, 800);
}

document.getElementById('btn-return').addEventListener('click', async () => {
  if (victoria) {
    await sincronizarProgreso();
  } else {
    localStorage.removeItem('emba_etapa_seleccionada');
    window.location.href = 'index.html';
  }
});

iniciarNivel(detectarEtapa());
